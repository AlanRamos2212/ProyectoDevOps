name: CI/CD - Jest, Playwright, EC2 y OpenObserve

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend - Jest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run Jest suite
        run: npm run test:backend

  frontend-e2e:
    name: Frontend - Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        run: npm run test:e2e --workspace frontend
        env:
          CI: true

      - name: Stop Compose services
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 30

  deploy-ec2:
    name: Deploy to EC2
    needs: [backend-tests, frontend-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_EC2_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment settings and prepare SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          EC2_JWT_SECRET: ${{ secrets.EC2_JWT_SECRET }}
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Missing secret EC2_HOST}"
          : "${EC2_USER:?Missing secret EC2_USERNAME}"
          : "${EC2_SSH_PRIVATE_KEY:?Missing secret EC2_SSH_PRIVATE_KEY}"
          : "${EC2_KNOWN_HOSTS:?Missing secret EC2_KNOWN_HOSTS}"
          : "${EC2_JWT_SECRET:?Missing secret EC2_JWT_SECRET}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Package and deploy application
        id: deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          EC2_JWT_SECRET: ${{ secrets.EC2_JWT_SECRET }}
          EC2_DEPLOY_PATH: ${{ vars.EC2_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          DEPLOY_PATH="${EC2_DEPLOY_PATH:-/opt/proyectodevops}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./backend/node_modules' \
            --exclude='./frontend/node_modules' \
            --exclude='./backend/data' \
            --exclude='./frontend/playwright-report' \
            --exclude='./frontend/test-results' \
            --exclude='./Evidencias' \
            --exclude='./.env' \
            -czf app.tar.gz .
          printf 'JWT_SECRET=%s\n' "$EC2_JWT_SECRET" > deployment.env
          chmod 600 deployment.env
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            app.tar.gz deployment.env "$EC2_USER@$EC2_HOST:/tmp/"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "mkdir -p '$DEPLOY_PATH' && \
             tar -xzf /tmp/app.tar.gz -C '$DEPLOY_PATH' && \
             mv /tmp/deployment.env '$DEPLOY_PATH/.env' && \
             chmod 600 '$DEPLOY_PATH/.env' && \
             cd '$DEPLOY_PATH' && \
             docker compose up -d --build --remove-orphans"

  openobserve-events:
    name: Send CI/CD events to OpenObserve
    needs: [backend-tests, frontend-e2e, deploy-ec2]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send pipeline and deployment events
        env:
          OPENOBSERVE_URL: ${{ vars.OPENOBSERVE_URL || 'https://api.openobserve.ai' }}
          OPENOBSERVE_ORG: ${{ vars.OPENOBSERVE_ORG }}
          OPENOBSERVE_STREAM: ${{ vars.OPENOBSERVE_STREAM_CI || 'ci_pipeline' }}
          OPENOBSERVE_AUTHORIZATION: ${{ secrets.OPENOBSERVE_AUTHORIZATION }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          PLAYWRIGHT_RESULT: ${{ needs.frontend-e2e.result }}
          DEPLOY_RESULT: ${{ needs.deploy-ec2.result }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          EXECUTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ -z "$OPENOBSERVE_ORG" ] || [ -z "$OPENOBSERVE_AUTHORIZATION" ]; then
            echo "OpenObserve no está configurado: define OPENOBSERVE_ORG y OPENOBSERVE_AUTHORIZATION."
            exit 0
          fi

          OPENOBSERVE_URL="${OPENOBSERVE_URL%/}"
          INGEST_URL="$OPENOBSERVE_URL/api/$OPENOBSERVE_ORG/$OPENOBSERVE_STREAM/_json"
          PIPELINE_STATUS="success"
          if [ "$BACKEND_RESULT" != "success" ] || [ "$PLAYWRIGHT_RESULT" != "success" ]; then
            PIPELINE_STATUS="failure"
          fi

          PIPELINE_EVENT="$(jq -cn \
            --arg event_type "pipeline_run" \
            --arg pipeline_status "$PIPELINE_STATUS" \
            --arg backend_result "$BACKEND_RESULT" \
            --arg playwright_result "$PLAYWRIGHT_RESULT" \
            --arg deployment_result "$DEPLOY_RESULT" \
            --arg commit "$COMMIT_SHA" \
            --arg branch "$BRANCH_NAME" \
            --arg user "$EXECUTOR" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{event_type:$event_type,pipeline_status:$pipeline_status,backend_result:$backend_result,playwright_result:$playwright_result,deployment_result:$deployment_result,commit:$commit,branch:$branch,user:$user,timestamp:$timestamp}')"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: $OPENOBSERVE_AUTHORIZATION" \
            -H "Content-Type: application/json" \
            --data "[$PIPELINE_EVENT]" \
            "$INGEST_URL"

          if [ "$DEPLOY_RESULT" != "skipped" ]; then
            DEPLOY_EVENT="$(jq -cn \
              --arg event_type "deployment" \
              --arg status "$DEPLOY_RESULT" \
              --arg commit "$COMMIT_SHA" \
              --arg branch "$BRANCH_NAME" \
              --arg user "$EXECUTOR" \
              --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{event_type:$event_type,status:$status,environment:"ec2",commit:$commit,branch:$branch,user:$user,timestamp:$timestamp}')"
            curl --fail-with-body --silent --show-error \
              -H "Authorization: $OPENOBSERVE_AUTHORIZATION" \
              -H "Content-Type: application/json" \
              --data "[$DEPLOY_EVENT]" \
              "$INGEST_URL"
          fi
