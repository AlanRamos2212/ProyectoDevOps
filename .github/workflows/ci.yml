name: CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  NODE_VERSION: 22
  OPENOBSERVE_ENDPOINT: https://openobserve.tu-dominio.com/api/v1/events

jobs:
  test:
    name: Ejecutar pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar
        run: npm ci --include=optional
      - name: Probar backend
        run: npm run test:backend
      - name: Probar frontend E2E
        run: npx playwright test

  deploy:
    name: Desplegar a EC2
    needs: test
    runs-on: ubuntu-latest
    if: success()

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Build
        run: npm run build -w backend && npm run build -w frontend
      - name: Deploy SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "$EC2_SSH_PRIVATE_KEY" | tr -d '\r' > deploy_key.pem
          chmod 600 deploy_key.pem
          rsync -avz -e "ssh -i deploy_key.pem -o StrictHostKeyChecking=yes" \
            ./backend/dist/ ./frontend/dist/ user@"$EC2_HOST":/opt/proyectodevops/
          ssh -i deploy_key.pem -o StrictHostKeyChecking=no user@"$EC2_HOST" << 'EOF'
            cd /opt/proyectodevops
            docker compose down || true
            docker compose up -d --build
          EOF

  notify:
    name: Notificar resultados
    needs: [test, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Reportar a OpenObserve
        if: always()
        run: |
          STATUS="${{ job.status }}"
          curl -s -X POST "\${OPENOBSERVE_ENDPOINT}/reporte-final" \
            -H "Content-Type: application/json" \
            -d "{\"pipeline\":\"ci-cd\",\"status\":\"${{ job.status }}\",\"test\":\"success\"}" \
            || echo "No conectado"