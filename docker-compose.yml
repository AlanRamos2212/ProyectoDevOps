services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["3000:3000"]
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
      DATABASE_PATH: /data/finance.db
    volumes:
      - finance_data:/data
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  finance_data:
